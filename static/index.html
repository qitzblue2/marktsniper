<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarktSniper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#12151d;--panel2:#181c26;--line:#232838;--text:#e8ebf2;--mute:#8a92a6;
--accent:#ff6a3d;--accent2:#ffb03d;--green:#2fd58b;--mp:#f0a500;--td:#2a8cff;--vi:#09b1ba;--r:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
body:before{content:"";position:fixed;inset:-30% -10% auto auto;width:700px;height:700px;
background:radial-gradient(circle,rgba(255,106,61,.16),transparent 60%);pointer-events:none;z-index:-1}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--line);
position:sticky;top:0;background:rgba(11,13,18,.85);backdrop-filter:blur(12px);z-index:5}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;
background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 20px rgba(255,106,61,.35)}
.live{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.live b{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px transparent}}
main{max-width:1280px;margin:auto;padding:28px;display:grid;grid-template-columns:380px 1fr;gap:28px}
@media(max-width:900px){main{grid-template-columns:1fr;padding:16px}header{padding:16px}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 14px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:20px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:600;color:var(--text);background:var(--panel2);border:1px solid var(--line);transition:.15s}
button:hover{border-color:#3a415a}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#1a0d05}
button.primary:hover{filter:brightness(1.08)}button.ghost{background:none;border:0;color:var(--mute);padding:6px}
.watch{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.watch:hover,.watch.sel{background:var(--panel2);border-color:var(--line)}
.watch .t{flex:1;min-width:0}.watch .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch .m{font-size:12.5px;color:var(--mute)}.cnt{background:var(--panel2);border:1px solid var(--line);padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.off{opacity:.45}.err{color:#ff7a7a;font-size:12px}
.presets{display:flex;flex-wrap:wrap;gap:8px}.chip{font-size:13px;padding:7px 12px;border-radius:99px}
label{display:block;font-size:12.5px;color:var(--mute);margin:12px 0 5px;font-weight:500}
input,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus{border-color:var(--accent)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plats{display:flex;gap:8px}.plats label{flex:1;margin:0;display:flex;gap:6px;align-items:center;justify-content:center;padding:9px;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--text);font-weight:600}
.plats input{width:auto;accent-color:var(--accent)}
.price{font-size:13px;color:var(--mute)}.price b{color:var(--text);font-size:20px}
input[type=range]{padding:0;accent-color:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.toolbar h1{margin:0;font-size:26px;letter-spacing:-.02em;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:.2s}
.item:hover{transform:translateY(-3px);border-color:#3a415a;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.item .img{aspect-ratio:4/3;background:var(--panel2) center/cover no-repeat;position:relative}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;color:#000;text-transform:uppercase}
.b-marktplaats{background:var(--mp)}.b-2dehands{background:var(--td);color:#fff}.b-vinted{background:var(--vi);color:#fff}
.new{position:absolute;top:10px;right:10px;background:var(--green);color:#03140c;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px}
.item .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.item .pr{font-size:22px;font-weight:800;letter-spacing:-.02em}.item .ti{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{font-size:12px;color:var(--mute);margin-top:auto;display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--mute);padding:80px 20px;border:1px dashed var(--line);border-radius:var(--r)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:24px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}.hint{font-size:12.5px;color:var(--mute)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo"><i>🎯</i>MarktSniper</div>
  <div style="display:flex;gap:16px;align-items:center">
    <span class="live"><b></b><span id="live">Live aan het zoeken</span></span>
    <button onclick="openSettings()">⚙️ Meldingen</button>
  </div>
</header>
<main>
  <aside>
    <div class="card">
      <h2>Snelstart</h2>
      <div class="presets" id="presets"></div>
    </div>
    <div class="card">
      <h2 id="formTitle">Nieuwe zoekopdracht</h2>
      <form id="form">
        <label>Naam</label><input name="name" required placeholder="bv. iPhone 14 koopje">
        <label>Zoekterm</label><input name="query" required placeholder="iphone">
        <label>Moet één van deze bevatten <span class="hint">(komma's)</span></label>
        <input name="include" placeholder="iphone 13, iphone 14, iphone 15">
        <label>Uitsluiten <span class="hint">(komma's)</span></label>
        <input name="exclude" placeholder="hoesje, kapot, defect">
        <label>Prijs</label>
        <div class="price">€<b id="minV">0</b> – €<b id="maxV">250</b></div>
        <div class="row">
          <input type="number" name="min_price" min="0" value="0" oninput="minV.textContent=this.value">
          <input type="number" name="max_price" min="1" value="250" oninput="maxV.textContent=this.value">
        </div>
        <label>Categorie</label>
        <select name="category_id"><option value="">Alle categorieën</option></select>
        <label>Platforms</label>
        <div class="plats">
          <label><input type="checkbox" name="platforms" value="marktplaats" checked>Marktplaats</label>
          <label><input type="checkbox" name="platforms" value="2dehands" checked>2dehands</label>
          <label><input type="checkbox" name="platforms" value="vinted" checked>Vinted</label>
        </div>
        <div style="display:flex;gap:10px;margin-top:18px">
          <button class="primary" style="flex:1" type="submit" id="saveBtn">🎯 Start met snipen</button>
          <button type="button" id="cancelBtn" hidden onclick="resetForm()">Annuleer</button>
        </div>
      </form>
    </div>
    <div class="card">
      <h2>Mijn zoekopdrachten</h2>
      <div id="watches"></div>
    </div>
  </aside>
  <section>
    <div class="toolbar">
      <h1 id="hitsTitle">Alle vondsten</h1>
      <select id="sort" style="width:auto" onchange="renderHits()">
        <option value="new">Nieuwste eerst</option><option value="cheap">Goedkoopste eerst</option>
      </select>
    </div>
    <div class="grid" id="hits"></div>
  </section>
</main>

<dialog id="settings">
  <h2 style="font-size:18px;text-transform:none;letter-spacing:0;color:var(--text)">Meldingen instellen</h2>
  <p class="hint">Installeer de gratis <b>ntfy</b>-app (iOS/Android), abonneer op een eigen geheime topicnaam en vul die hier in. Je krijgt dan een push zodra er een koopje opstaat.</p>
  <label>ntfy topic</label><input id="s_ntfy" placeholder="mijn-geheime-sniper-topic-123">
  <label>Telegram bot token <span class="hint">(optioneel)</span></label><input id="s_tgt">
  <label>Telegram chat ID <span class="hint">(optioneel)</span></label><input id="s_tgc">
  <label>Elke hoeveel seconden zoeken</label><input id="s_int" type="number" min="30">
  <label><input type="checkbox" id="s_browser" style="width:auto"> Ook browsermeldingen op deze computer</label>
  <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end">
    <button onclick="testNotif()">Testmelding</button>
    <button onclick="settings.close()">Sluiten</button>
    <button class="primary" onclick="saveSettings()">Opslaan</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s), form = $('#form');
let watches = [], hits = [], selected = null, editing = null, seen = new Set(), firstLoad = true;
const api = (u, o = {}) => fetch('/api' + u, {headers: {'Content-Type': 'application/json'}, ...o}).then(r => r.json());
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = t => { $('#toast').textContent = t; $('#toast').classList.add('show'); setTimeout(() => $('#toast').classList.remove('show'), 2500) };
const ago = t => { const s = (Date.now()/1000 - t) | 0; return s < 60 ? 'zojuist' : s < 3600 ? `${s/60|0} min geleden` : s < 86400 ? `${s/3600|0} uur geleden` : `${s/86400|0} d geleden` };

async function init() {
  const [presets, cats] = await Promise.all([api('/presets'), api('/categories')]);
  $('#presets').innerHTML = presets.map((p, i) => `<button class="chip" data-i="${i}">${esc(p.name)}</button>`).join('');
  $('#presets').onclick = e => { const i = e.target.dataset.i; if (i != null) fill(presets[i]) };
  form.category_id.innerHTML += cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  refresh(); setInterval(refresh, 20000);
}

function fill(w) {
  for (const k of ['name','query','include','exclude','min_price','max_price']) form[k].value = w[k] ?? '';
  form.category_id.value = w.category_id ?? '';
  minV.textContent = form.min_price.value; maxV.textContent = form.max_price.value;
  form.querySelectorAll('[name=platforms]').forEach(c => c.checked = !w.platforms || w.platforms.includes(c.value));
  form.name.focus();
}

function resetForm() { editing = null; form.reset(); minV.textContent = 0; maxV.textContent = 250;
  $('#formTitle').textContent = 'Nieuwe zoekopdracht'; $('#saveBtn').textContent = '🎯 Start met snipen'; $('#cancelBtn').hidden = true }

form.onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(form));
  d.platforms = [...form.querySelectorAll('[name=platforms]:checked')].map(c => c.value);
  if (!d.platforms.length) return toast('Kies minstens één platform');
  d.min_price = +d.min_price || 0; d.max_price = +d.max_price || 999999; d.category_id = d.category_id ? +d.category_id : null;
  $('#saveBtn').textContent = 'Bezig met zoeken…';
  if (editing) await api('/watches/' + editing, {method: 'PUT', body: JSON.stringify(d)});
  else await api('/watches', {method: 'POST', body: JSON.stringify(d)});
  toast('Opgeslagen – je krijgt meldingen bij nieuwe koopjes'); resetForm(); refresh();
};

async function refresh() {
  [watches, hits] = await Promise.all([api('/watches'), api('/hits')]);
  const fresh = hits.filter(h => h.notified && !seen.has(h.id));
  if (!firstLoad && localStorage.browserNotif === '1' && Notification.permission === 'granted')
    fresh.forEach(h => new Notification(`🎯 €${h.price} · ${h.watch_name}`, {body: h.title, icon: h.image}).onclick = () => open(h.url));
  hits.forEach(h => seen.add(h.id)); firstLoad = false;
  renderWatches(); renderHits();
}

function renderWatches() {
  $('#watches').innerHTML = watches.length ? watches.map(w => {
    const err = w.last_error ? Object.entries(JSON.parse(w.last_error)).map(([p]) => p).join(', ') : '';
    return `<div class="watch ${selected === w.id ? 'sel' : ''} ${w.active ? '' : 'off'}" data-id="${w.id}">
      <div class="t"><div class="n">${esc(w.name)}</div>
      <div class="m">€${w.min_price}–€${w.max_price} · ${w.platforms.length} platforms${w.last_check ? ' · ' + ago(w.last_check) : ''}</div>
      ${err ? `<div class="err">⚠ geblokkeerd: ${esc(err)}</div>` : ''}</div>
      <span class="cnt">${w.hit_count}</span>
      <button class="ghost" data-a="edit" title="Bewerken">✏️</button>
      <button class="ghost" data-a="toggle" title="Pauze">${w.active ? '⏸' : '▶️'}</button>
      <button class="ghost" data-a="del" title="Verwijderen">🗑</button></div>`;
  }).join('') : '<p class="hint">Nog niks. Klik op een snelstart hierboven 👆</p>';
}

$('#watches').onclick = async e => {
  const el = e.target.closest('.watch'); if (!el) return;
  const id = +el.dataset.id, w = watches.find(x => x.id === id), a = e.target.dataset.a;
  if (a === 'del') { if (confirm(`"${w.name}" verwijderen?`)) { await api('/watches/' + id, {method: 'DELETE'}); if (selected === id) selected = null } }
  else if (a === 'toggle') await api('/watches/' + id, {method: 'PUT', body: JSON.stringify({...w, active: !w.active})});
  else if (a === 'edit') { fill(w); editing = id; $('#formTitle').textContent = 'Bewerken'; $('#saveBtn').textContent = 'Opslaan'; $('#cancelBtn').hidden = false; return }
  else selected = selected === id ? null : id;
  refresh();
};

function renderHits() {
  let list = selected ? hits.filter(h => h.watch_id === selected) : hits;
  if ($('#sort').value === 'cheap') list = [...list].sort((a, b) => a.price - b.price);
  $('#hitsTitle').textContent = selected ? watches.find(w => w.id === selected)?.name : 'Alle vondsten';
  $('#hits').innerHTML = list.length ? list.map(h => `<a class="item" href="${esc(h.url)}" target="_blank" rel="noopener">
    <div class="img" style="background-image:url('${esc(h.image || '')}')">
      <span class="badge b-${h.platform}">${h.platform}</span>${h.notified && Date.now()/1000 - h.found_at < 3600 ? '<span class="new">NIEUW</span>' : ''}</div>
    <div class="body"><div class="pr">€${h.price.toLocaleString('nl-NL')}</div><div class="ti">${esc(h.title)}</div>
    <div class="meta"><span>${esc(h.location || h.watch_name)}</span><span>${ago(h.found_at)}</span></div></div></a>`).join('')
    : '<div class="empty" style="grid-column:1/-1">🔍<br>Nog geen vondsten. Maak links een zoekopdracht aan.</div>';
}

async function openSettings() {
  const s = await api('/settings');
  s_ntfy.value = s.ntfy_topic || ''; s_tgt.value = s.telegram_token || ''; s_tgc.value = s.telegram_chat_id || '';
  s_int.value = s.interval || 120; s_browser.checked = localStorage.browserNotif === '1'; settings.showModal();
}
async function saveSettings() {
  await api('/settings', {method: 'PUT', body: JSON.stringify({ntfy_topic: s_ntfy.value.trim(), telegram_token: s_tgt.value.trim(),
    telegram_chat_id: s_tgc.value.trim(), interval: String(Math.max(30, +s_int.value || 120))})});
  localStorage.browserNotif = s_browser.checked ? '1' : '0';
  if (s_browser.checked && 'Notification' in window) Notification.requestPermission();
  settings.close(); toast('Instellingen opgeslagen');
}
async function testNotif() { await saveSettings(); await api('/test-notification', {method: 'POST'}); toast('Testmelding verstuurd 📲') }
init();
</script>
</body>
</html>
