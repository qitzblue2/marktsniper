name: Build apps

on:
  push:
    branches: [main, master, claude/laughing-faraday-i3qv22]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            task: packageReleaseMsi
            glob: desktop/build/compose/binaries/main-release/msi/*.msi
          - os: macos-latest
            task: packageReleaseDmg
            glob: desktop/build/compose/binaries/main-release/dmg/*.dmg
          - os: ubuntu-latest
            task: packageReleaseDeb
            glob: desktop/build/compose/binaries/main-release/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:${{ matrix.task }}
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MarktSniper (nieuwste versie)
          prerelease: false
          files: ${{ matrix.glob }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleRelease && cp app/build/outputs/apk/release/app-release.apk MarktSniper.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MarktSniper (nieuwste versie)
          files: MarktSniper.apk
